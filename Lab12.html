<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12</title>
</head>
<body>
    <form action="#">
        <label for="name">Name: </label>
        <input type="text" id="name"> <br>
        <button type="button" id="submit">Submit</button>
    </form>
    <p id="greet"></p>
    <br>

    <form action="#">
        <label for="number1">Enter a number: </label>
        <input type="number" id="number1"><br>
        <label for="number2">Enter a number: </label>
        <input type="number" id="number2"><br><br>
        <input type="radio" name="opt" value="add">add
        <input type="radio" name="opt" value="sub">sub
        <input type="radio" name="opt" value="mul">mul
        <input type="radio" name="opt" value="div">div<br>
        <button type="button" id="calculate">Submit</button>
    </form>
    <p>Result</p>
    <p id="result"></p>

    <button type="reset" id="reset"> Reset</button>

    <script>
        const name = document.getElementById('name');
        const greet = document.getElementById('greet');

        document.getElementById('submit').addEventListener('click', function(){
            greet.textContent = `Welcome ${name.value}`;
        });


        const number1 = document.getElementById('number1');
        const number2 = document.getElementById('number2');
        const result = document.getElementById('result');
        
        document.getElementById('calculate').addEventListener('click', function(){
            const calculation = document.querySelector('[name = opt]:checked');
            if (calculation.value === 'add'){
                const answer = (Number(number1.value)+ Number(number2.value))
                result.textContent = answer
            }
            if (calculation.value === 'sub'){
                const answer = (Number(number1.value)- Number(number2.value))
                result.textContent = answer
            }
            if (calculation.value === 'div'){
                const answer = (Number(number1.value)/Number(number2.value))
                result.textContent = answer
            }
            if (calculation.value === 'mul'){
                const answer = (Number(number1.value)*Number(number2.value))
                result.textContent = answer
            }
            
        })

        document.getElementById('reset').addEventListener('click',function(){
            name.value = ""
            greet.textContent = ""
            number1.value = ""
            number2.value = ""
            result.textContent = ""
        })
        
    </script>
</body>
</html>
