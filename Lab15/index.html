<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        const site = 'https://jsonplaceholder.typicode.com/posts';

        let result = []

        


        const getSite = async()=>{
            try {
                result = await fetch(site);
                result = await result.json();
                return result;
            } catch{
                (reason) => console.log(reason)
            }
        }

        const displayPost = async()=>{
            result = await getSite();
            console.table(result);
            for(let i = 0; i < result.length; i++){
                let article = document.createElement('article');
                let title = document.createElement('h2');
                let body = document.createElement('p');
                let ids = document.createElement('ul');
                let user = document.createElement('li');
                let post = document.createElement('li');

                title.textContent = result[i].title;
                body.textContent = result[i].body;
                user.textContent = `User ID: ` + result[i].userId;
                post.textContent = `Post ID: ` + result[i].id;

                document.body.appendChild(article)
                article.appendChild(title);
                article.appendChild(body);
                article.appendChild(ids);
                ids.appendChild(user);
                ids.appendChild(post);
            }
        }

        displayPost();

        
        document.getElementById(`filterBtn`).addEventListener(`click`, async()=>{
            let userId = document.getElementById(`userID`);
            userId = userId.value
            console.log(userId)
            result = await getSite();
            let filterResult = []
            for(let i = 0; i < result.length; i++){
                if (Number(result[i].userId) == userId){
                    filterResult.push(result[i])
                }
            }
            if(filterResult.length >= 1 ){
            console.table(filterResult)
            }
        })

        document.getElementById('displayUserBtn').addEventListener('click', async()=>{
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            let displayUserID = document.getElementById('displayUserID').value;
            result = await getSite();
            let displayResult = [];
            for(let i = 0; i < result.length; i++){
                if (Number(result[i].userId) == displayUserID){
                    displayResult.push(result[i]);
                };
            };
            for(let i = 0; i < displayResult.length; i++){
                let article = document.createElement('article');
                let title = document.createElement('h2');
                let body = document.createElement('p');
                let ids = document.createElement('ul');
                let user = document.createElement('li');
                let post = document.createElement('li');

                title.textContent = displayResult[i].title;
                body.textContent = displayResult[i].body;
                user.textContent = `User ID: ` + displayResult[i].userId;
                post.textContent = `Post ID: ` + displayResult[i].id;

                document.body.appendChild(article)
                article.appendChild(title);
                article.appendChild(body);
                article.appendChild(ids);
                ids.appendChild(user);
                ids.appendChild(post);
            };
        });

        document.getElementById('findBtn').addEventListener('click', async () => {
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            let postID = document.getElementById('postID').value;
            result = await getSite();
            let displayPost = [];
            for(let i = 0; i < result.length; i++){
                if (Number(result[i].id) == postID){
                    displayPost.push(result[i]);
                };
            };
            for(let i = 0; i < displayPost.length; i++){
                let article = document.createElement('article');
                let title = document.createElement('h2');
                let body = document.createElement('p');
                let ids = document.createElement('ul');
                let user = document.createElement('li');
                let post = document.createElement('li');

                title.textContent = displayPost[i].title;
                body.textContent = displayPost[i].body;
                user.textContent = `User ID: ` + displayPost[i].userId;
                post.textContent = `Post ID: ` + displayPost[i].id;

                document.body.appendChild(article)
                article.appendChild(title);
                article.appendChild(body);
                article.appendChild(ids);
                ids.appendChild(user);
                ids.appendChild(post);
            };
            if(displayPost.length < 1){
                let error = document.createElement('p');

                error.textContent = 'Please enter a valid Post ID from 1-100.'

                document.body.appendChild(error)
            }
        });
    </script>

</body>
</html>
